# Builds the desktop app (Electron) for Windows, macOS and Linux on GitHub's machines.
#
#   Try a build:     Actions → Desktop app → Run workflow. The installers are downloads on the run's page
#                    (only you can see them; they expire after 90 days).
#   Release it:      Run workflow with a version typed in (e.g. 1.1.1), or push a tag:  git tag v1.1.1  then  git push origin v1.1.1
#                    The installers go on a GitHub Release, and installed copies update themselves from it.
#                    Testers' link (always the newest): https://github.com/matthettich/seeds/releases/latest
#
#   Beta build:      Run workflow from the `beta` branch with a version like 1.1.0-beta.1 (any version with a "-" is a
#                    pre-release automatically, typed in or pushed as a tag; or tick "pre-release" for any version).
#                    A pre-release is never "latest", so installed copies don't update to it; testers download it by hand.
#
# Releases go on this repo's Releases page (the app's updater reads them from here), using the built-in token.
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.1.1 (leave empty for a test build)'
        required: false
        default: ''
      prerelease:
        description: 'Pre-release (a beta build: installed copies will not update to it)'
        type: boolean
        default: false
  push:
    tags: ['v*.*.*']

# Read-only by default; only the release job can write (see release.permissions).
permissions:
  contents: read

env:
  # A release: a pushed vX.Y.Z tag, or Run workflow with a version typed in.
  TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') && format('v{0}', inputs.version) || github.ref_name }}
  RELEASING: ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') || startsWith(github.ref, 'refs/tags/v') }}
  APP_DIR: desktop                         # where package.json is
  RELEASE_REPO: ${{ github.repository }}   # releases go on this repo (the app's updater reads them from here)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: --win }
          - { os: macos-latest,   args: --mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }   # npm install runs third-party scripts; keep the token out of .git/config
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Version from the release
        if: env.RELEASING == 'true'
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - name: Updater tests
        shell: bash
        run: node --test tests/updater.test.js
      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          node copy-app.js
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no signing certificate: unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ env.APP_DIR }}/dist/*.exe
            ${{ env.APP_DIR }}/dist/*.dmg
            ${{ env.APP_DIR }}/dist/*.zip
            ${{ env.APP_DIR }}/dist/*.AppImage
            ${{ env.APP_DIR }}/dist/*.blockmap
            ${{ env.APP_DIR }}/dist/latest*.yml

  release:
    # Only when releasing: one release with every platform's files, published when all of them built.
    if: (github.event_name == 'workflow_dispatch' && inputs.version != '') || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create/upload the release
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Pre-release when ticked on Run workflow, or for any version with a suffix (v1.1.0-beta.1, from Run workflow or a pushed tag).
          PRE: ${{ ((github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name, '-')) && '--prerelease' || '' }}
        run: |
          ls -la out
          # GitHub's answer goes on the run's summary page too, so a refused token says why.
          say(){ if ! out=$("$@" 2>&1); then echo "$out"; echo "::error::Publishing to $RELEASE_REPO failed: $(echo "$out" | tail -n 3 | tr '\n' ' ')"; exit 1; fi; echo "$out"; }
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            say gh release upload "$TAG" out/* --repo "$RELEASE_REPO" --clobber
          else
            say gh release create "$TAG" out/* --repo "$RELEASE_REPO" --title "$TAG" $PRE --target "$GITHUB_SHA" --notes "Desktop build $TAG. Windows: Seeds-Setup .exe. Mac: the .dmg (arm64 for Apple silicon, x64 for Intel). Installed copies update themselves."
          fi
